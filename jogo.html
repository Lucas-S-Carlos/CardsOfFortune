<!DOCTYPE html>
<html lang="pt-br">

<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Great+Vibes&display=swap" rel="stylesheet">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="Scr/css.css">
    <title>CARDS</title>
</head>

<body>
    <div class="fundo"></div>

    <div class="particles" id="pts"></div>

    <header class="header">
        <nav class="nav">
            <div class="titulo-container">
                <h1 class="titulo">Cards of Fortune</h1>
            </div>
            <button class="sair" onclick="document.getElementById('sairModal').showModal()">Sair</button>
        </nav>
    </header>

     <section class="caixas-ganho">

      <div class="logo2">
        <img src="Scr/Assets/imagens/logo-das-cartas.png" />
      </div>

      <div class="logo">
        <img src="Scr/Assets/imagens/dsbet.png" />
      </div>
    </section>

    <div class="caixa-saldo">
        <h1>Saldo</h1>
        <h2 id="saldoAtual"> 0</h2>
      </div>
    

      <div class="caixa-temporizador" id="timer">
        
      </div>
      
      <div class="container">
       <div class="parte_aposta">
     
         <div class="caixa-aposta">
           <h1>Aposta</h1>
           <h2 id="entrada">0</h2>
         </div>
     
         <button class="mais" id="mais" onclick="adicionar()">+</button>
         <button class="menos" id="menos" onclick="remover()">-</button>
        
        </div>
       </div>

        <div class="botao_aposta">
          <div class="brilho"> 
           <button class="pode" id="pode" onclick="poder()">Apostar</button>
          </div> 

         
        </div>
        <div class="batao_coletar">
            <button class="coletar" disabled=true id="coletar" onclick="exibirModal(); console.log('clique');">Coletar ganhos</button>
         </div>
      

    <section>

     
        <div>
            <div class="card" id="a1"></div>
            <div class="card" id="a2"></div>
            <div class="card" id="a3"></div>
        </div>

        <div>
            <div class="card" id="b1"></div>
            <div class="card" id="b2"></div>
            <div class="card" id="b3"></div>
        </div>

        <div>
            <div class="card" id="c1"></div>
            <div class="card" id="c2"></div>
            <div class="card" id="c3"></div>
        </div>

        <div>
            <div class="card" id="d1"></div>
            <div class="card" id="d2"></div>
            <div class="card" id="d3"></div>
        </div>

        <div>
            <div class="card" id="e1"></div>
            <div class="card" id="e2"></div>
            <div class="card" id="e3"></div>
        </div>

        <div>
            <div class="card" id="f1"></div>
            <div class="card" id="f2"></div>
            <div class="card" id="f3"></div>
        </div>
    
      
    </section>


    
       <p class="ganho" id="ganho"></p>

        <div class="formulario-dois">
            <div class="anuncio-container">
              <img class="anuncio ativo" src="Scr/Assets/imagens/propagandaeslote.jpeg" />
              <img class="anuncio" src="Scr/Assets/imagens/PropagandaMines(2).png" />
              <img class="anuncio" src="Scr/Assets/imagens/propagandacartas.jpeg" />
            </div>
        </div>
    


   
    <dialog class="perdeModal" id="perdeModal">
        <h1 id="textoPerde">Você perdeu!</h1>
          <img class="bum" src="Scr/Assets/imagens/bum.gif" />
       <div class="botaos_perdeu">
        <button class="botao_dnovo" onclick="continuar('perdeu')">Tente novamente</button>
        <button class="botao_desistir" onclick="reload()">Desistir</button>
       </div>
    </dialog>
    <dialog class="gameOverModal" id="gameOverModal">
        <h1>Faliu :(</h1>
        <img class="bum" src="Scr/Assets/imagens/capirava.gif" />
        <button class="botao_dnovo" onclick="reload()">Desistir</button>
    </dialog>

    <dialog class="perdeModal" id="sairModal">
        <h1 id="sairTexto"></h1>
       <div class="botaos_sair">
        <button class="botao_dnovo" onclick="sairModal.close()">Continuar</button>
        <button class="botao_desistir" onclick="reload()">Sair</button>
       </div>
    </dialog>




    <dialog class="perdeModal" id="coletaModal">
        <h1 id="valorModal"></h1>
        <button  class="botao_dnovo" onclick="continuar('ganhou')">Continue jogando</button>
        <button class="botao_desistir" onclick="reload()">Sair</button>
    </dialog>
    <dialog class="perdeModal" id="tempoModal">
        <h1 id="tempoModaltxt"></h1>
        <button class="botao_dnovo" onclick="reload()">Sair</button>
    </dialog>
    <footer class="footer2">
        <div class="footer-content">
            <h2 class="footer-logo">CARDS OF FORTUNE</h2>
            <p class="footer-text">
                Projeto desenvolvido exclusivamente para fins educacionais, no âmbito das atividades acadêmicas da
                ETEC de Guarulhos.
            </p>
            <div class="footer-links">
                <a>Termos</a>
                <a>Privacidade</a>
                <a>Suporte</a>
            </div>
            <p class="footer-copy">© 2026 DSBet - Todos os direitos reservados</p>
        </div>
    </footer>


       
      <script>
        const syms = ['🃏', '💰', '⭐', '💎', '🎰', '♠', '♥', '♦', '♣', '🏆', '🎴'];
        const pts = document.getElementById('pts');
        for (let i = 0; i < 20; i++) {
            const el = document.createElement('div');
            el.className = 'particle';
            el.textContent = syms[Math.floor(Math.random() * syms.length)];
            el.style.left = (Math.random() * 90) + 'vw';
            el.style.animationDuration = (9 + Math.random() * 14) + 's';
            el.style.animationDelay = (Math.random() * 18) + 's';
            el.style.fontSize = (13 + Math.random() * 18) + 'px';
            pts.appendChild(el);
        }
    </script>
    


    <script src="Scr/global.js"></script>
    <script src="Scr/virarCartas.js"></script>
    <script src="Scr/sorteios.js"></script>
    <script src="Scr/cartas.js"></script>
    <script src="Scr/timer.js"></script>
    <script src="Scr/anuncio.js"></script>
      <script src="https://cdn.jsdelivr.net/npm/@hiseb/confetti@2.1.0/dist/confetti.min.js"></script>
</body>

</html>
